name: Build

on:
  push:
    branches: ["**"]
    paths: ["src/**", "tests/**", "Hark.sln", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write   # only used to publish screenshots to the ci-screenshots branch

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test tests/Hark.Core.Tests/Hark.Core.Tests.csproj -c Release

      - name: Test voice engine (downloads the offline voice models once, about 300 MB)
        run: dotnet test tests/Hark.Voice.Tests/Hark.Voice.Tests.csproj -c Release

      - name: Publish app (self-contained, no .NET install needed on the laptop)
        run: dotnet publish src/Hark.App/Hark.App.csproj -c Release -r win-x64 --self-contained true -o out/hark

      - name: Add the voice models to the app folder
        shell: pwsh
        run: |
          $kws = "sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
          $stt = "sherpa-onnx-moonshine-base-en-int8"
          New-Item -ItemType Directory -Force "out/hark/models/$kws", "out/hark/models/$stt" | Out-Null
          Copy-Item "models/$kws/encoder-epoch-12-avg-2-chunk-16-left-64.onnx", "models/$kws/decoder-epoch-12-avg-2-chunk-16-left-64.onnx", "models/$kws/joiner-epoch-12-avg-2-chunk-16-left-64.onnx", "models/$kws/tokens.txt", "models/$kws/bpe.model" "out/hark/models/$kws"
          Copy-Item "models/$stt/preprocess.onnx", "models/$stt/encode.int8.onnx", "models/$stt/uncached_decode.int8.onnx", "models/$stt/cached_decode.int8.onnx", "models/$stt/tokens.txt" "out/hark/models/$stt"
          Copy-Item "models/silero_vad.onnx" "out/hark/models"
          "{0:N0} MB of voice models" -f ((Get-ChildItem out/hark/models -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          if (-not (Get-ChildItem out/hark -Filter "sherpa-onnx*.dll" -Recurse)) { throw "The voice engine's native library is missing from the published app." }

      - name: Check the Copilot runtime is in the app folder
        shell: pwsh
        run: |
          $found = Get-ChildItem out/hark -Recurse -Filter "copilot*" | Select-Object -ExpandProperty FullName
          $found
          if (-not $found) { throw "Copilot runtime files are missing from the published app." }
          if (-not (Test-Path out/hark/Hark.exe)) { throw "Hark.exe is missing." }

      - name: Screenshots of each screen with sample data
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name, $page, $dark, $extra) {
            $v = if ($dark) { 0 } else { 1 }
            $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name AppsUseLightTheme -Value $v -Type DWord
            $p = Start-Process -FilePath "out/hark/Hark.exe" -ArgumentList (@("--demo","--page",$page) + @($extra | Where-Object { $_ })) -PassThru
            Start-Sleep -Seconds 8
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("shots/$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
          }
          Shot "chat-light" 0 $false
          Shot "chat-capture" 0 $false "--demo-capture"
          Shot "chat-approvals" 0 $false "--demo-approvals"
          Shot "chat-approvals-dark" 0 $true "--demo-approvals"
          Shot "voice-listening" 1 $false @("--demo-voice","listening")
          Shot "voice-working" 1 $false @("--demo-voice","working")
          Shot "voice-answer" 1 $true @("--demo-voice","answer")
          Shot "history-light" 1 $false
          Shot "connections-light" 2 $false
          Shot "settings-light" 3 $false
          Shot "chat-dark" 0 $true
          Shot "connections-dark" 2 $true
          Get-ChildItem shots

      - name: Publish screenshots to the ci-screenshots branch
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Test-Path shots/*.png)) { Write-Host "No screenshots to publish."; exit 0 }
          $url = git remote get-url origin
          $auth = git config --get-all http.https://github.com/.extraheader
          Push-Location shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "$auth"
          git add *.png
          git commit -q -m "Screenshots for $env:GITHUB_SHA"
          git push -f $url ci-screenshots
          Pop-Location

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: hark-win-x64
          path: out/hark
          retention-days: 14
