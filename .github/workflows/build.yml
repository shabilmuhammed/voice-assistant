name: Build

on:
  push:
    branches: ["**"]
    paths: ["src/**", "tests/**", "Hark.sln", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write   # only used to publish screenshots to the ci-screenshots branch

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test tests/Hark.Core.Tests/Hark.Core.Tests.csproj -c Release

      - name: Publish app (self-contained, no .NET install needed on the laptop)
        run: dotnet publish src/Hark.App/Hark.App.csproj -c Release -r win-x64 --self-contained true -o out/hark

      - name: Check no voice files reach the app (voice is parked in parked/voice)
        shell: pwsh
        run: |
          $voice = @(Get-ChildItem out/hark -Recurse | Where-Object { $_.Name -match "sherpa|NAudio|Hark\.Voice" }) + @(Get-Item out/hark/models -ErrorAction SilentlyContinue)
          if ($voice) { $voice.FullName; throw "Voice files were found in the published app." }
          "No voice files in the app."

      - name: Check the Copilot runtime is in the app folder
        shell: pwsh
        run: |
          $found = Get-ChildItem out/hark -Recurse -Filter "copilot*" | Select-Object -ExpandProperty FullName
          $found
          if (-not $found) { throw "Copilot runtime files are missing from the published app." }
          if (-not (Test-Path out/hark/MarTechChat.exe)) { throw "MarTechChat.exe is missing." }

      - name: Screenshots of each screen with sample data
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          New-Item -ItemType Directory -Force shots | Out-Null
          function Shot($name, $page, $dark, $extra) {
            $v = if ($dark) { 0 } else { 1 }
            $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name AppsUseLightTheme -Value $v -Type DWord
            $p = Start-Process -FilePath "out/hark/MarTechChat.exe" -ArgumentList (@("--demo","--page",$page) + @($extra | Where-Object { $_ })) -PassThru
            Start-Sleep -Seconds 8
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("shots/$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
          }
          Shot "chat-light" 0 $false
          Shot "chat-capture" 0 $false "--demo-capture"
          Shot "chat-approvals" 0 $false "--demo-approvals"
          Shot "chat-approvals-dark" 0 $true "--demo-approvals"
          Shot "chat-empty" 0 $false "--demo-empty"
          Shot "chat-empty-dark" 0 $true "--demo-empty"
          Shot "history-dark" 1 $true
          Shot "skills-light" 2 $false
          Shot "skills-dark" 2 $true
          Shot "skill-editor" 2 $false "--demo-skill-editor"
          Shot "chat-slash" 0 $false "--demo-slash"
          Shot "chat-slash-dark" 0 $true "--demo-slash"
          Shot "settings-dark" 4 $true
          Shot "quick-typing" 1 $false @("--demo-quick","typing")
          Shot "quick-typing-dark" 1 $true @("--demo-quick","typing")
          Shot "quick-working" 1 $false @("--demo-quick","working")
          Shot "quick-answer" 1 $true @("--demo-quick","answer")
          Shot "history-light" 1 $false
          Shot "connections-light" 3 $false
          Shot "settings-light" 4 $false
          Shot "settings-azure-dark" 4 $true "--demo-azure"
          Shot "chat-dark" 0 $true
          Shot "connections-dark" 3 $true
          Get-ChildItem shots

      - name: Press every button on every screen
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "Hark\hark.log"
          if (Test-Path $log) { Remove-Item $log }
          foreach ($theme in 1, 0) {
            Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Name AppsUseLightTheme -Value $theme -Type DWord
            $p = Start-Process -FilePath "out/hark/MarTechChat.exe" -ArgumentList "--demo","--selftest" -PassThru
            if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "The self-test did not finish." }
            $p = Start-Process -FilePath "out/hark/MarTechChat.exe" -ArgumentList "--demo","--demo-approvals","--selftest" -PassThru
            if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "The self-test did not finish." }
          }
          Get-Content $log
          $text = Get-Content $log -Raw
          if ($text -notmatch "SELFTEST DONE") { throw "The self-test did not report completion." }
          if ($text -match "ERROR") { throw "The app logged an error while its buttons were pressed. See the log above." }

      - name: Show the app log from the screenshot runs
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "Hark\hark.log"
          if (Test-Path $log) { Get-Content $log -Tail 120 } else { "No log file." }

      - name: Publish screenshots to the ci-screenshots branch
        shell: pwsh
        continue-on-error: true
        run: |
          if (-not (Test-Path shots/*.png)) { Write-Host "No screenshots to publish."; exit 0 }
          $url = git remote get-url origin
          $auth = git config --get-all http.https://github.com/.extraheader
          Push-Location shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.https://github.com/.extraheader "$auth"
          git add *.png
          git commit -q -m "Screenshots for $env:GITHUB_SHA"
          git push -f $url ci-screenshots
          Pop-Location

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: martechchat-win-x64
          path: out/hark
          retention-days: 14
